(){let a=all(),q=$('search').value.trim().toLowerCase();$('tabs').innerHTML=cats.map((c,i)=>'<button data-tab="'+i+'" class="'+(i===tab?'active':'')+'">'+c[0]+'<small>'+a.filter(x=>x.cat===i&&x.img).length+'写真 / '+a.filter(x=>x.cat===i).length+'枠</small></button>').join('');let z=a.filter(x=>x.cat===tab&&(!onlyPhoto||x.img)&&(!onlyFav||fav.has(x.id))&&(!q||(x.name+' '+x.desc).toLowerCase().includes(q)));$('stat').textContent='全体 '+a.filter(x=>x.img).length+'枚の写真 / '+a.length+'件の素材　｜　表示 '+z.length+'件';$('count').textContent=selected.size+'件選択';$('photos').classList.toggle('active',onlyPhoto);$('fav').classList.toggle('active',onlyFav);$('grid').innerHTML=z.map(x=>'<article class="card '+(selected.has(x.id)?'selected':'')+'"><div class="visual">'+(x.img?'<img loading="lazy" data-act="view" data-id="'+x.id+'" alt="'+esc(x.name)+'" src="'+esc(x.img)+'">':'<div class="placeholder"><strong>'+cats[x.cat][1]+'</strong>写真未収録<br>生成プロンプト付き</div>')+'<button class="star" data-act="fav" data-id="'+x.id+'">'+(fav.has(x.id)?'★':'☆')+'</button></div><div class="info"><div class="tag">'+esc(x.origin)+'</div><div class="name">'+esc(x.name)+'</div><div class="desc">'+esc(x.desc)+'</div><div class="acts"><button data-act="sel" data-id="'+x.id+'">'+(selected.has(x.id)?'選択済':'選択')+'</button><button data-act="view" data-id="'+x.id+'">'+(x.img?'拡大':'生成・追加')+'</button></div></div></article>').join('')||'<div class="empty">該当する素材はありません。</div>'}function view(x){open(x.name,(x.img?'<img src="'+esc(x.img)+'" alt="参考画像"><p>長押しで画像を保存できる場合があります。</p>':'<p>この枠にはまだ写真がありません。</p>')+'<p>'+esc(x.desc)+'</p><div class="tools"><button id="cp">生成プロンプトコピー</button><button id="cd">参考指定コピー</button></div><label>この枠に写真を登録<input id="one" type="file" accept="image/*"></label><button id="saveone" class="primary">写真を保存</button><p id="msg"></p>');$('cp').onclick=()=>copy(prompt(x));$('cd').onclick=()=>copy(directive(x));$('saveone').onclick=async()=>{try{let f=$('one').files[0];if(!f)throw Error('写真を選んでください');let v={id:x.id,img:await compress(f)};if(x.id.startsWith('u_'))v={...x,img:v.img};await op('readwrite',s=>s.put(v));if(x.id.startsWith('u_'))custom=custom.map(y=>y.id===x.id?v:y);else overrides[x.id]=v;$('modal').hidden=true;render();toast('写真を保存しました')}catch(e){$('msg').textContent=e.message||'保存できませんでした'}}}function compress(f){return new Promise((res,rej)=>{let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,1200/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.87))};im.onerror=()=>{URL.revokeObjectURL(u);rej(Error('画像を開けません'))};im.src=u})}function options(){return cats.map((c,i)=>'<option value="'+i+'" '+(i===tab?'selected':'')+'>'+c[0]+'</option>').join('')}function uid(){return 'u_'+Date.now()+'_'+Math.random().toString(36).slice(2)}function item(img,cat,name,desc){return {id:uid(),cat,name,desc,img,origin:'ユーザー追加写真'}}async function putMany(v){await op('readwrite',s=>{v.forEach(x=>s.put(x))});custom.push(...v);tab=v[0].cat;onlyPhoto=false;onlyFav=false;$('search').value='';$('modal').hidden=true;render();toast(v.length+'枚追加しました')}function add(split){open(split?'生成画像シートを分割':'写真を一括追加','<label>画像（複数選択）<input id="fs" type="file" accept="image/*" multiple></label><label>カテゴリー<select id="cat">'+options()+'</select></label><label>素材名<input id="nm" placeholder="例：極濃ホステスメイク"></label><label>説明<input id="ds" placeholder="参考にする部分"></label>'+(split?'<label>列数<input id="nx" type="number" min="1" max="10" value="3"></label><label>行数<input id="ny" type="number" min="1" max="10" value="3"></label><p>均等な格子、余白なしの画像シート用。</p>':'')+'<button id="go" class="primary">登録</button><p id="msg"></p>');$('go').onclick=async()=>{let fs=[...$('fs').files],cat=Number($('cat').value),name=$('nm').value,desc=$('ds').value,arr=[];if(!fs.length)return toast('画像を選んでください');$('go').disabled=true;try{for(let f of fs){if(!split){arr.push(item(await compress(f),cat,(name||f.name)+(fs.length>1?' '+(arr.length+1):''),desc));continue}let nx=Number($('nx').value),ny=Number($('ny').value);if(!Number.isInteger(nx)||!Number.isInteger(ny)||nx<1||ny<1||nx>10||ny>10)throw Error('行列は1〜10');let im=await new Promise((res,rej)=>{let u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(Error('画像を開けません'))};i.src=u});for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let x0=Math.round(x*im.width/nx),y0=Math.round(y*im.height/ny),w=Math.round((x+1)*im.width/nx)-x0,h=Math.round((y+1)*im.height/ny)-y0,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,x0,y0,w,h,0,0,w,h);arr.push(item(c.toDataURL('image/jpeg',.86),cat,(name||'生成参考')+' '+(arr.length+1),desc))}}await putMany(arr)}catch(e){$('msg').textContent=e.message||'保存に失敗しました';$('go').disabled=false}}}function download(obj){let u=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='henbou_DARK_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=Number(b.dataset.tab);$('search').value='';render()}};$('grid').onclick=e=>{let b=e.target.closest('[data-act]');if(!b)return;let x=all().find(a=>a.id===b.dataset.id);if(!x)return;let act=b.dataset.act;if(act==='view')view(x);else if(act==='sel'){selected.has(x.id)?selected.delete(x.id):selected.add(x.id);render()}else{fav.has(x.id)?fav.delete(x.id):fav.add(x.id);try{localStorage.setItem('dark-fav',JSON.stringify([...fav]))}catch{}render()}};$('search').oninput=render;$('photos').onclick=()=>{onlyPhoto=!onlyPhoto;render()};$('fav').onclick=()=>{onlyFav=!onlyFav;render()};$('clear').onclick=()=>{selected.clear();render()};$('copy').onclick=()=>{let a=all().filter(x=>selected.has(x.id));if(!a.length)return toast('素材を選択してください');copy('【小説変貌 DARK｜参照指定】\n本人の顔を固定。指定部分のみ参考。\n\n'+a.map(directive).join('\n\n'))};$('add').onclick=()=>add(false);$('sheet').onclick=()=>add(true);$('backup').onclick=()=>download({version:1,photos:[...custom,...Object.values(overrides)],fav:[...fav]});function valid(x){return x&&typeof x.id==='string'&&typeof x.img==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(x.img)&&(base.some(b=>b.id===x.id)||(x.id.startsWith('u_')&&Number.isInteger(x.cat)&&x.cat>=0&&x.cat<cats.length))}function loadRows(rows){custom=rows.filter(x=>x.id.startsWith('u_')&&valid(x));overrides=Object.fromEntries(rows.filter(x=>!x.id.startsWith('u_')&&valid(x)).map(x=>[x.id,x]));render()}$('restore').onclick=()=>{open('DARK バックアップ復元','<input id="f" type="file" accept="application/json,.json"><button id="r">復元</button><p id="msg"></p>');$('r').onclick=async()=>{try{let b=JSON.parse(await $('f').files[0].text());if(!Array.isArray(b.photos))throw Error();let v=b.photos.filter(valid);await op('readwrite',s=>v.forEach(x=>s.put(x)));loadRows(await op('readonly',s=>s.getAll()));for(let id of Array.isArray(b.fav)?b.fav:[])fav.add(id);try{localStorage.setItem('dark-fav',JSON.stringify([...fav]))}catch{}$('modal').hidden=true;render();toast(v.length+'件復元しました')}catch{$('msg').textContent='復元できませんでした'}}};render();op('readonly',s=>s.getAll()).then(loadRows).catch(()=>toast('端末保存はSafariなどで開いてご利用ください'));
</script></body></html>
